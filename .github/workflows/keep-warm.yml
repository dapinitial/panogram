# Keeps the free-tier Supabase project from pausing.
#
# Supabase's rule (docs/guides/platform/free-project-pausing): a Free project is
# paused when it gets "too few user queries" over a week; "typically a few user
# requests to the database EACH DAY" is enough to stay up. History of this file:
#  - 2026-08-26: 1 read / 3 days — secret pointed at the WRONG project; green
#    for a month while Panogram paused (2026-09-22).
#  - 2026-09-22: re-pointed + guard added, 1 read / 2 days — correct target but
#    BELOW the threshold; pause warning again 2026-09-28.
#  - 2026-09-28: 4 runs/day × 4 queries (~16 real DB queries/day).
#
# URL + key come from repo secrets (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY), never
# committed. The publishable key is anon-safe; reads are RLS public-read tables.
name: Keep Supabase warm

on:
  schedule:
    # Every 6 hours at :17 (odd minute avoids GitHub's top-of-hour cron pile-up).
    - cron: "17 */6 * * *"
  workflow_dispatch: {} # manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase (several real DB reads = "user activity")
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Missing SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY repo secrets"; exit 1
          fi
          # Guard: only ever ping the Panogram project (ref moepkkdpsimwpshgvwlt).
          case "$URL" in
            *moepkkdpsimwpshgvwlt.supabase.co*) ;;
            *) echo "::error::SUPABASE_URL is not the Panogram project (moepkkdpsimwpshgvwlt) — refusing to ping a different database"; exit 1 ;;
          esac
          fail=0
          for t in posts trips maps profiles; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "$URL/rest/v1/$t?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || code="000"
            echo "REST $t → HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          # Any non-200 = paused/unhealthy — fail loudly so GitHub emails the owner.
          if [ "$fail" = "1" ]; then
            echo "::error::Keep-warm ping failed — project may be paused or unhealthy"; exit 1
          fi
